apiVersion: scheduling.fengrru.dev/v1alpha1
kind: SchedulingPolicy
metadata:
  name: latency-critical
spec:
  podSelector:
    matchLabels:
      app: payment-api
  weight: 9000
  budgetMicroseconds: 2000  # cap slice at 2ms (default slice is 5ms)
---
apiVersion: scheduling.fengrru.dev/v1alpha1
kind: SchedulingPolicy
metadata:
  name: batch-background
spec:
  podSelector:
    matchLabels:
      tier: batch
  weight: 200  # below the 1000 default: deprioritizes batch workloads
---
apiVersion: scheduling.fengrru.dev/v1alpha1
kind: SchedulingPolicy
metadata:
  name: crashloop-backoff
spec:
  podSelector:
    matchLabels:
      tier: batch
  weight: 200  # crash-looping best-effort jobs lose priority
  celCondition: "signal.podQOSClass == 'BestEffort' && signal.podRestartCount >= 3"
