apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: schedulingpolicies.scheduling.fengrru.dev
  labels:
    app.kubernetes.io/part-of: k8s-sched
spec:
  group: scheduling.fengrru.dev
  names:
    kind: SchedulingPolicy
    listKind: SchedulingPolicyList
    plural: schedulingpolicies
    singular: schedulingpolicy
    shortNames:
      - sp
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                podSelector:
                  type: object
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          operator:
                            type: string
                            enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                          values:
                            type: array
                            items:
                              type: string
                weight:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  description: Scheduling weight. Higher = more CPU time; values below 1000 deprioritize a workload. 1000 is the default applied when no matching policy sets a weight.
                budgetMicroseconds:
                  type: integer
                  minimum: 0
                  description: Max CPU time per scheduling slice (caps the 5ms default slice; values >= 5000 have no effect). 0 = unlimited.
                celCondition:
                  type: string
                  description: "Optional CEL expression that must evaluate to true for the policy to apply. Variables: signal.podName/podNamespace/podUID (string), signal.podQOSClass (Guaranteed/Burstable/BestEffort), signal.podPriorityClass (string), signal.podRestartCount (int), signal.podCPURequest/podCPULimit (double, cores), signal.nodeName (string), context.policyName (string), context.weight/context.budgetUs (double, 0 when unset)."
            status:
              type: object
              properties:
                activePods:
                  type: integer
                  description: Number of pods matching this policy.
                nodeStatuses:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: integer
                  description: Per-node matching pod counts (node -> policy -> count). Written by each node's agent.
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                  description: Current state conditions of the policy.
                observedGeneration:
                  type: integer
                  format: int64
                  description: Most recent generation observed for this policy.
