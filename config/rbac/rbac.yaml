apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-sched
  namespace: kube-system
  labels:
    app.kubernetes.io/name: k8s-sched
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-sched
  labels:
    app.kubernetes.io/name: k8s-sched
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["scheduling.fengrru.dev"]
    resources: ["schedulingpolicies"]
    verbs: ["get", "list", "watch"]
  # Status write-back: each node's agent reports its per-policy
  # matching pod counts into SchedulingPolicy.status.nodeStatuses.
  - apiGroups: ["scheduling.fengrru.dev"]
    resources: ["schedulingpolicies/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-sched
  labels:
    app.kubernetes.io/name: k8s-sched
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-sched
subjects:
  - kind: ServiceAccount
    name: k8s-sched
    namespace: kube-system
