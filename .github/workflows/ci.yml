name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 libbpf-dev

      - name: go fmt
        run: go fmt ./...

      - name: go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./internal/cel/ ./internal/maps/ ./internal/k8s/ ./internal/policy/

      - name: Run vtime tests
        run: go test -race -v -run TestVtime ./internal/maps/

      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Must be >= a golangci-lint built with Go 1.25, otherwise it
          # cannot typecheck this module (go 1.25) and exits with code 3.
          version: v2.12

  # Boots a real sched_ext kernel (Ubuntu mainline build) in a QEMU VM
  # via virtme-ng, then: dumps vmlinux.h from its BTF, compiles the BPF
  # scheduler against it, and runs a load+attach+schedule smoke test.
  # This is the only place the BPF C code gets truly verified in CI.
  # The kernel matrix guards against sched_ext API drift across the
  # supported range (v6.12 = first sched_ext release, v6.15 = current).
  bpf-verify:
    name: BPF Verify (${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    needs: lint-and-test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kernel: [v6.12, v6.13, v6.14, v6.15]
    env:
      # Ubuntu mainline kernel with CONFIG_SCHED_CLASS_EXT=y.
      SCX_KERNEL: ${{ matrix.kernel }}
      BPFTOOL_VERSION: v7.5.0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install clang, QEMU, virtme-ng, static bpftool
        run: |
          sudo apt-get update
          sudo apt-get install -y clang qemu-system-x86 virtme-ng
          mkdir -p bin
          curl -fsSL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | tar -xz -C bin
          chmod +x bin/bpftool

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || sudo chmod 666 /dev/kvm || true

      - name: Pre-build smoke test binary
        run: go test -c -o bin/sched-smoke.test ./internal/sched/

      - name: vmlinux.h + BPF compile + smoke test (inside sched_ext VM)
        run: vng --verbose --rw -r "$SCX_KERNEL" -- bash hack/vm-smoke.sh

      - name: Upload BPF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bpf-${{ github.sha }}-${{ matrix.kernel }}
          path: |
            bpf/vmlinux.h
            bpf/k8s_sched.bpf.o

  chart-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint chart/k8s-sched

      - name: helm template (render sanity check)
        run: helm template k8s-sched chart/k8s-sched --namespace kube-system > /dev/null

  # Regenerates the CRD from the kubebuilder markers in api/v1alpha1 and
  # fails if the committed YAML drifts (descriptions, defaults, schema).
  # Keep the controller-gen version in sync with the one used locally
  # for `make manifests` (see Makefile).
  manifests-check:
    name: CRD Manifests Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Install controller-gen (pinned)
        run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.17.3

      - name: Regenerate CRD and check for drift
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make manifests
          git diff --exit-code -- config/crd/

      - name: Show drift if any
        if: failure()
        run: git diff -- config/crd/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Build Go binary
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/agent ./cmd/agent

      - name: Verify binary
        run: file bin/agent && test -x bin/agent

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-test, bpf-verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      # vmlinux.h generated against a real sched_ext kernel by the
      # bpf-verify job — NOT the runner kernel, which lacks sched_ext
      # BTF types and would produce a broken BPF object. The v6.14
      # matrix entry is the project's primary target kernel.
      - name: Download vmlinux.h from bpf-verify
        uses: actions/download-artifact@v8
        with:
          name: bpf-${{ github.sha }}-v6.14
          path: bpf/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/fengrru/k8s-sched:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
